server {
    listen 80;
    listen [::]:80;
    server_name skymedia.example.com;

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name skymedia.example.com;

    root /var/www/skymedia/public;
    index index.php;

    # SSL — replace with your cert paths (use certbot for Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/skymedia.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/skymedia.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Security headers
    add_header X-Frame-Options           "SAMEORIGIN"  always;
    add_header X-Content-Type-Options    "nosniff"     always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Logging
    access_log /var/log/nginx/skymedia_access.log;
    error_log  /var/log/nginx/skymedia_error.log;

    charset utf-8;
    client_max_body_size 64M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass  unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include       fastcgi_params;
        fastcgi_read_timeout 300;
    }

    # Block .env and dot files
    location ~ /\.(env|git|htaccess) {
        deny all;
    }

    # DVR storage — only serve .ts and .m3u8 if needed internally
    location /storage/dvr/ {
        deny all;
    }
}
