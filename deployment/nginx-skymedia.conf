server {
    listen 80 default_server;
    root /var/www/skymedia/public;
    index index.php;

    access_log /dev/stdout;
    error_log  /dev/stderr;

    client_max_body_size 512M;

    # ── Direct HLS serving (slug-based URLs only) ─────────────────────
    # Serves .m3u8 playlists and .ts segments directly from the DVR
    # directory via nginx, completely bypassing PHP-FPM. This eliminates
    # ~10-30ms of PHP overhead per request (routing, middleware, cookies,
    # file response), which is critical for smooth HLS playback with
    # 2-second segments.
    #
    # Matches slug-based URLs containing at least one letter (e.g.
    # /hls/prc-tv/output.m3u8, /hls/247tv1/live.m3u8). Pure numeric IDs
    # (e.g. /hls/17/output.m3u8) fall through to PHP which redirects
    # to the slug-based URL.
    location ~ ^/hls/(?=[a-zA-Z0-9_-]*[a-zA-Z])([a-zA-Z0-9_-]+)/(.+)$ {
        alias /var/skymedia/dvr/$1/$2;

        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, OPTIONS";
        add_header Access-Control-Allow-Headers "Range";
        add_header Cache-Control $hls_cache_control;

        # Suppress access log for high-volume HLS segment traffic
        access_log off;
    }

    # ── Laravel application ───────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass  unix:/run/php/php8.2-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include       fastcgi_params;
        fastcgi_read_timeout 300;
    }

    # ── Security ──────────────────────────────────────────────────────
    location ~ /\. { deny all; }
    location /storage/dvr/ { deny all; }
}
