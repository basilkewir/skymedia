server {
    listen 80 default_server;
    root /var/www/skymedia/public;
    index index.php;

    access_log /dev/stdout;
    error_log  /dev/stderr;

    client_max_body_size 512M;

    # HLS cache headers — map directive is already in /etc/nginx/nginx.conf http block.
    # The $hls_cache_control variable is available here.

    # ── Direct HLS serving from DVR ─────────────────────────────────────
    # Serves .m3u8 playlists and .ts segments directly from the DVR
    # directory via nginx, bypassing PHP-FPM. Supports both slug-based
    # and numeric-ID URLs.
    location ~ ^/hls/(?=[a-zA-Z0-9_-]*[a-zA-Z])([a-zA-Z0-9_-]+)/(.+)$ {
        alias /var/skymedia/dvr/$1/$2;

        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, OPTIONS";
        add_header Access-Control-Allow-Headers "Range";
        add_header Cache-Control $hls_cache_control;

        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t ts;
        }

        access_log off;
    }

    # ── Laravel application ───────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass  unix:/run/php/php8.2-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include       fastcgi_params;
        fastcgi_read_timeout 300;
    }

    # ── Security ──────────────────────────────────────────────────────
    location ~ /\. { deny all; }
    location /storage/dvr/ { deny all; }
}
