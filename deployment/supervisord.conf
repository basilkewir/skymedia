[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisord]
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor
nodaemon=false
user=root

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

; ---------------------------------------------------------------
; SkyMedia: Stream Monitor Daemon
; ---------------------------------------------------------------
[program:skymedia-monitor]
command=php /var/www/skymedia/artisan streams:monitor
directory=/var/www/skymedia
autostart=true
autorestart=true
startretries=10
startsecs=3
user=www-data
stdout_logfile=/var/log/skymedia/monitor.log
stderr_logfile=/var/log/skymedia/monitor-error.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
environment=HOME="/var/www",USER="www-data"

; ---------------------------------------------------------------
; SkyMedia: Laravel Scheduler (runs every minute)
; ---------------------------------------------------------------
[program:skymedia-scheduler]
command=/bin/bash -c "while true; do php /var/www/skymedia/artisan schedule:run --no-interaction >> /var/log/skymedia/scheduler.log 2>&1; sleep 60; done"
directory=/var/www/skymedia
autostart=true
autorestart=true
user=www-data
stdout_logfile=/var/log/skymedia/scheduler.log
stderr_logfile=/var/log/skymedia/scheduler-error.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

; ---------------------------------------------------------------
; SkyMedia: Laravel Queue Worker (for jobs/events)
; ---------------------------------------------------------------
[program:skymedia-queue]
command=php /var/www/skymedia/artisan queue:work --sleep=3 --tries=3 --max-time=3600
directory=/var/www/skymedia
autostart=true
autorestart=true
startretries=5
user=www-data
stdout_logfile=/var/log/skymedia/queue.log
stderr_logfile=/var/log/skymedia/queue-error.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
