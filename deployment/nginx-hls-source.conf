server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    location /hls/ {
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control no-cache;
        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t ts;
        }
    }
}
