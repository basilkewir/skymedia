# HLS cache control — included at http level via conf.d/
# Maps URI to appropriate Cache-Control header:
#   .m3u8 playlists: no-cache (must always revalidate for live edge)
#   .ts segments: short cache (reused across playlist refreshes)
map $uri $hls_cache_control {
    ~\.m3u8$  "no-cache, no-store, must-revalidate";
    ~\.ts$    "public, max-age=2, s-maxage=2";
    default   "no-cache";
}
