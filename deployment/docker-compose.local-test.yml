# Local test: full stack (MySQL + Redis + app + rtmp) for testing
# push to external Wowza server with real IPTV source.
#
# Usage:
#   docker compose -f deployment/docker-compose.local-test.yml up -d --build
#   docker compose -f deployment/docker-compose.local-test.yml exec app php artisan tinker
#   (then create channel + push destination — see deployment/setup-test-channel.sh)
services:
  app:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    ports:
      - "8080:80"
      - "20000-20099:20000-20099/tcp"
      - "30000-30099:30000-30000/udp"
    environment:
      SKYMEDIA_PROD: "true"
      APP_URL: "http://localhost:8080"
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: skymedia
      DB_USERNAME: skymedia
      DB_PASSWORD: skymedia123
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SKYMEDIA_SERVER_IP: "host.docker.internal"
      SKYMEDIA_LLOD_V3_REENCODE_INGEST: "true"
      SKYMEDIA_LLOD_V3_REENCODE_FALLBACK: "true"
    volumes:
      - storage_data:/var/www/skymedia/storage
      - dvr_data:/var/skymedia/dvr
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  rtmp:
    image: tiangolo/nginx-rtmp
    ports:
      - "1935:1935"
      - "8083:8081"
    volumes:
      - ./nginx-rtmp.conf:/etc/nginx/nginx.conf

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: skymedia
      MYSQL_USER: skymedia
      MYSQL_PASSWORD: skymedia123
      MYSQL_ROOT_PASSWORD: root123
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "skymedia", "-pskymedia123"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db_data:
  redis_data:
  storage_data:
  dvr_data:
