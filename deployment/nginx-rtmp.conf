# nginx-rtmp configuration for SkyMedia
# This provides a standard RTMP endpoint on port 1935
# that can be used for testing or as a frontend

daemon off;
worker_processes auto;
error_log /dev/stdout info;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
}

rtmp {
    server {
        listen 1935;
        chunk_size 4096;
        max_connections 1000;

        # Application for live streaming
        application live {
            live on;
            record off;

            # Allow publishing from any IP
            allow publish all;
            allow play all;

            # HLS output for testing
            hls on;
            hls_path /tmp/hls;
            hls_fragment 2;
            hls_playlist_length 10;
            hls_fragment_slicing aligned;
        }

        # Application for static stream testing
        application static {
            live on;
            record off;
            allow publish all;
            allow play all;

            # HLS output for branded preview
            hls on;
            hls_path /tmp/hls-static;
            hls_fragment 2;
            hls_playlist_length 6;
            hls_fragment_slicing aligned;
            hls_nested on;
        }
    }
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 8081;

        # Serve HLS for live app testing
        location /hls {
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            root /tmp;
            add_header Cache-Control no-cache;
            add_header Access-Control-Allow-Origin *;
        }

        # Serve branded HLS preview (from nginx-rtmp)
        location /hls-static {
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            root /tmp;
            add_header Cache-Control no-cache;
            add_header Access-Control-Allow-Origin *;
        }
    }
}