# nginx-rtmp configuration for SkyMedia
# This provides a standard RTMP endpoint on port 1935
# that can be used for testing or as a frontend

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

rtmp {
    server {
        listen 1935;
        chunk_size 4096;

        # Application for live streaming
        application live {
            live on;
            record off;
            
            # Allow publishing from any IP
            allow publish all;
            
            # HLS output for testing
            hls on;
            hls_path /tmp/hls;
            hls_fragment 3;
            hls_playlist_length 60;
        }
        
        # Application for static stream testing
        application static {
            live on;
            record off;
            allow publish all;
        }
    }
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    server {
        listen 8080;
        
        # Serve HLS for testing
        location /hls {
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            root /tmp;
            add_header Cache-Control no-cache;
            add_header Access-Control-Allow-Origin *;
        }
    }
}