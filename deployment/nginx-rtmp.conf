# nginx-rtmp configuration for SkyMedia
# Single RTMP entry point on port 1935 for all channels.
# OBS/vMix pushes here → on_publish callback triggers ffmpeg HLS pull.

worker_processes auto;
error_log /dev/stdout info;

events {
    worker_connections 4096;
}

rtmp {
    server {
        listen 1935;
        chunk_size 4096;
        max_connections 1000;

        # Single ingest application — all channels share port 1935.
        # on_publish validates the stream key and triggers the app's ffmpeg
        # to pull HLS from the internal endpoint (http://rtmp:8081/hls/{key}/).
        application live {
            live on;
            record off;

            allow publish all;
            allow play all;

            # Callback: validate stream key → start ffmpeg HLS pull in app
            on_publish http://app:80/api/rtmp/on-publish;
            on_publish_done http://app:80/api/rtmp/on-publish-done;

            # HLS output — nested mode so each stream gets its own directory
            hls on;
            hls_path /tmp/hls;
            hls_nested on;
            hls_fragment 2;
            hls_playlist_length 30;
            hls_fragment_slicing aligned;
        }

        # Application for static stream testing / internal relay
        application static {
            live on;
            record off;
            allow publish all;
            allow play all;

            hls on;
            hls_path /tmp/hls-static;
            hls_fragment 2;
            hls_playlist_length 6;
            hls_fragment_slicing aligned;
            hls_nested on;
        }
    }
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 8081;

        location /hls {
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            root /tmp;
            add_header Cache-Control no-cache;
            add_header Access-Control-Allow-Origin *;
        }

        location /hls-static {
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            root /tmp;
            add_header Cache-Control no-cache;
            add_header Access-Control-Allow-Origin *;
        }
    }
}