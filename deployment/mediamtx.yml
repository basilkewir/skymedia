# MediaMTX v1.19.2 — SkyMedia ingest receiver
logLevel: info
logDestinations: [stdout]

api: true
apiAddress: :9997

authInternalUsers:
  - user: any
    pass:
    ips: []
    permissions:
      - action: publish
        path:
      - action: read
        path:
      - action: api
        path:

rtmp: true
rtmpAddress: :1935
rtmpEncryption: "no"

pathDefaults:
  runOnReady: sh -c 'curl -sf -X POST http://app:80/api/rtmp/on-publish -d "name=$MTX_PATH" &'
  runOnReadyRestart: false
  runOnNotReady: sh -c 'curl -sf -X POST http://app:80/api/rtmp/on-publish-done -d "name=$MTX_PATH" &'

paths:
  "~.*":
    runOnReady: sh -c 'curl -sf -X POST http://app:80/api/rtmp/on-publish -d "name=$MTX_PATH" &'
    runOnReadyRestart: false
    runOnNotReady: sh -c 'curl -sf -X POST http://app:80/api/rtmp/on-publish-done -d "name=$MTX_PATH" &'
