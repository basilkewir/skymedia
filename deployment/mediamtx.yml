# MediaMTX v1.19.2 — SkyMedia ingest receiver
logLevel: info
logDestinations: [stdout]

api: true
apiAddress: :9997

authInternalUsers:
  - user: any
    pass:
    ips: []
    permissions:
      - action: publish
        path:
      - action: read
        path:
      - action: api
        path:

rtmp: true
rtmpAddress: :1935
rtmpEncryption: "no"

pathDefaults:
  runOnReadyRestart: false

paths:
  "~.*":
