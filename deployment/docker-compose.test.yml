services:
  app:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    ports:
      - "8888:80"
      - "20000-20099:20000-20099/tcp"
      - "30000-30099:30000-30099/udp"
    environment:
      - APP_URL=http://localhost:8888
    volumes:
      - storage_data:/var/www/skymedia/storage
      - source-hls:/tmp/test-source:ro
    depends_on:
      source:
        condition: service_healthy

  hls-server:
    image: nginx:alpine
    volumes:
      - source-hls:/usr/share/nginx/html/hls:ro
      - ./nginx-hls-source.conf:/etc/nginx/conf.d/default.conf

  rtmp:
    image: alfg/nginx-rtmp
    ports:
      - "1935:1935"

  source:
    image: jrottenberg/ffmpeg:7-ubuntu
    command: >
      -re -f lavfi -i testsrc2=size=1280x720:rate=30:duration=86400
      -f lavfi -i sine=frequency=440:duration=86400
      -c:v libx264 -preset veryfast -b:v 2000k -pix_fmt yuv420p
      -g 60 -keyint_min 30
      -c:a aac -b:a 128k
      -f hls -hls_time 4 -hls_list_size 10
      -hls_flags delete_segments+omit_endlist
      -hls_segment_filename /tmp/hls/seg_%05d.ts
      /tmp/hls/live.m3u8
    volumes:
      - source-hls:/tmp/hls
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/hls/live.m3u8"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  source-hls:
  storage_data:
  db_data:
